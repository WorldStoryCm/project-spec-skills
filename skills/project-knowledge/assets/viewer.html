<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Knowledge map</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #203832;
        --muted: #65756e;
        --line: #dce4dd;
        --paper: #f7f8f3;
        --white: #fff;
        --teal: #286e60;
        --pale: #e8f1eb;
        --amber: #9a641b;
        --red: #a04740;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          15px/1.5 system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      a:focus-visible,
      [tabindex]:focus-visible {
        outline: 3px solid #6aa994;
        outline-offset: 2px;
      }
      header {
        height: 70px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
        border-bottom: 1px solid var(--line);
        gap: 20px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        background: var(--teal);
        color: white;
        border-radius: 9px;
        font-weight: 700;
      }
      .brand strong {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .brand small,
      .subtle {
        color: var(--muted);
      }
      .header-note {
        font-size: 13px;
        color: var(--muted);
        text-align: right;
      }
      /* The list stays; the rest of the width is either the graph or the open page, chosen by the tabs. */
      .workspace {
        display: grid;
        grid-template-columns: 270px minmax(0, 1fr);
        grid-template-rows: auto minmax(0, 1fr);
        height: calc(100vh - 70px - 48px);
        min-height: 0;
      }
      .workspace > aside {
        grid-row: 1 / -1;
      }
      .workspace > .map,
      .workspace > .reader {
        grid-column: 2;
        grid-row: 2;
      }
      .workspace[data-view="reader"] > .map,
      .workspace:not([data-view="reader"]) > .reader {
        display: none;
      }
      .viewtabs {
        grid-column: 2;
        grid-row: 1;
        display: flex;
        gap: 22px;
        padding: 0 26px;
        background: #fff;
        border-bottom: 1px solid var(--line);
      }
      .viewtabs button {
        border: 0;
        border-bottom: 2px solid transparent;
        background: none;
        padding: 11px 2px 9px;
        color: var(--muted);
      }
      .viewtabs button:hover {
        color: var(--ink);
      }
      .viewtabs button[aria-selected="true"] {
        border-color: var(--teal);
        color: var(--teal);
        font-weight: 650;
      }
      aside,
      .reader {
        background: #fff;
        padding: 24px;
        min-width: 0;
      }
      aside {
        border-right: 1px solid var(--line);
        overflow: auto;
        min-height: 0;
      }
      .reader {
        overflow: auto;
        min-height: 0;
        padding: 34px 48px 80px;
      }
      .reader > * {
        max-width: 780px;
        margin-left: auto;
        margin-right: auto;
      }
      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }
      h1 {
        font-size: 24px;
        line-height: 1.2;
        letter-spacing: -0.03em;
        margin-bottom: 8px;
      }
      h2 {
        font-size: 17px;
        line-height: 1.3;
        margin-bottom: 12px;
      }
      h3 {
        font-size: 15px;
      }
      .section-label {
        font-weight: 650;
        font-size: 13px;
        margin: 22px 0 9px;
      }
      .search {
        width: 100%;
        border: 1px solid #cedbd2;
        border-radius: 7px;
        padding: 10px 12px;
        background: #fafcf9;
      }
      .search::placeholder {
        color: #829089;
      }
      select {
        width: 100%;
        border: 1px solid #cedbd2;
        border-radius: 7px;
        background: #fff;
        padding: 9px;
      }
      .filters {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }
      .filters button,
      .tools button {
        border: 0;
        background: transparent;
        border-radius: 6px;
        padding: 7px 9px;
        color: var(--muted);
      }
      .filters button[aria-pressed="true"] {
        background: var(--pale);
        color: var(--teal);
        font-weight: 650;
      }
      .list {
        margin-top: 12px;
        display: grid;
        gap: 3px;
      }
      .item {
        display: block;
        width: 100%;
        text-align: left;
        background: transparent;
        border: 0;
        border-radius: 7px;
        padding: 10px;
        color: var(--ink);
      }
      .item:hover,
      .item[aria-current="true"] {
        background: #edf4ef;
      }
      .item strong {
        font-size: 14px;
        display: block;
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .item small {
        color: var(--muted);
      }
      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--teal);
        margin-right: 7px;
      }
      .dot.pending {
        background: #be8230;
      }
      .dot.conflict {
        background: var(--red);
      }
      .dot.stale {
        background: #826b9a;
      }
      .dot.st-needs-recheck {
        background: #ee8a00;
        box-shadow: 0 0 0 2px #fde3b8;
      }
      .dot.st-needs-decision {
        background: #5a3fc8;
        box-shadow: 0 0 0 2px #dcd5f6;
      }
      .dot.st-accepted {
        background: #5fa88f;
      }
      .dot.st-deferred {
        background: #b4b4a2;
      }
      .dot.st-rejected {
        background: #fff;
        border: 2px solid #a04740;
      }
      .dot.st-done {
        background: #fff;
        border: 2px solid #286e60;
      }
      .dot.st-duplicate {
        background: #d9d9d9;
      }
      [hidden] {
        display: none !important;
      }
      .modebar {
        height: 48px;
        display: flex;
        align-items: stretch;
        gap: 8px;
        padding: 7px 28px;
        background: #fff;
        border-bottom: 3px solid var(--teal);
      }
      body[data-mode="gaps"] .modebar {
        border-bottom-color: #5a3fc8;
      }
      .modebar button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid #cedbd2;
        background: #fff;
        border-radius: 7px;
        padding: 0 14px;
        font-weight: 650;
        color: var(--muted);
      }
      .modebar button[aria-pressed="true"] {
        background: var(--teal);
        border-color: var(--teal);
        color: #fff;
      }
      body[data-mode="gaps"] .modebar button[aria-pressed="true"] {
        background: #5a3fc8;
        border-color: #5a3fc8;
      }
      .modebar .hint {
        align-self: center;
        margin-left: 6px;
        font-size: 13px;
        color: var(--muted);
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pill {
        background: #ee8a00;
        color: #1d1200;
        border-radius: 10px;
        padding: 0 7px;
        font-size: 12px;
        line-height: 18px;
      }
      .state-filters button {
        display: inline-flex;
        align-items: center;
        gap: 2px;
      }
      .state-filters .n {
        margin-left: 4px;
        font-variant-numeric: tabular-nums;
        opacity: 0.8;
      }
      .filters button[aria-pressed="true"] {
        outline: 1px solid #b6d3c3;
      }
      .item .row2 {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 3px;
      }
      .item .facts-line {
        display: block;
        margin-top: 3px;
        font-size: 12px;
      }
      .section-label.sub {
        font-weight: 600;
        color: var(--muted);
      }
      .gap-facts {
        margin: 0 0 18px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-left: 5px solid #b4b4a2;
        border-radius: 6px;
        background: #fafcf9;
        font-size: 13px;
      }
      .gap-facts.st-needs-recheck {
        border-left-color: #ee8a00;
      }
      .gap-facts.st-needs-decision {
        border-left-color: #5a3fc8;
      }
      .gap-facts dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 4px 12px;
        margin: 0;
      }
      .gap-facts dt {
        color: var(--muted);
      }
      .gap-facts dd {
        margin: 0;
        min-width: 0;
      }
      .link-list {
        list-style: none;
        margin: 0 0 18px;
        padding: 0;
        display: grid;
        gap: 4px;
      }
      .link-list li {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }
      .link-block {
        margin: 0 0 18px;
      }
      .link-block h2 {
        font-size: 13px;
        margin: 0 0 6px;
        color: var(--muted);
      }
      .hintline {
        font-size: 12px;
        margin: 12px 0 0;
      }
      .map {
        padding: 26px;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .map-head {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 15px;
      }
      .map-head p {
        max-width: 570px;
        color: var(--muted);
        font-size: 13px;
      }
      .counts {
        display: flex;
        gap: 20px;
        margin: 10px 0 20px;
      }
      .counts button {
        border: 0;
        background: none;
        padding: 0;
        text-align: left;
        color: var(--muted);
        font-size: 13px;
      }
      .counts b {
        display: block;
        color: var(--ink);
        font-size: 21px;
      }
      .graph-wrap {
        position: relative;
        flex: 1;
        min-height: 180px;
        background: #f0f4ee;
        border: 1px solid #e0e9df;
        border-radius: 10px;
        overflow: hidden;
      }
      .graph-wrap svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: grab;
      }
      .graph-wrap svg.dragging {
        cursor: grabbing;
      }
      .graph-wrap line {
        stroke: #9fbcaa;
        stroke-width: 1.5;
      }
      .graph-wrap line.cross {
        stroke: #b7c6bb;
        stroke-dasharray: 5 4;
      }
      .graph-wrap rect.cluster {
        fill: #e7eee4;
        stroke: #cddbcb;
        stroke-width: 1.5;
      }
      .graph-wrap text.cluster-label,
      .graph-node.area text {
        font-size: 15px;
        font-weight: 650;
        fill: #2c4a3d;
      }
      .graph-node.area text {
        stroke: #e7eee4;
      }
      .graph-node {
        cursor: pointer;
      }
      .graph-node circle {
        fill: #b6d3c3;
        stroke: #fff;
        stroke-width: 3;
      }
      .graph-node rect {
        fill: #b6d3c3;
        stroke: #fff;
        stroke-width: 3;
      }
      .graph-node.area circle {
        fill: #327969;
      }
      .graph-node.pending circle {
        fill: #d3a05b;
      }
      .graph-node.conflict circle {
        fill: #c16a61;
      }
      .graph-node.stale circle {
        stroke: #826b9a;
      }
      .graph-node.plan-node rect {
        fill: #cfe3f2;
        stroke: #3d6f95;
      }
      .graph-node.context circle {
        fill: #f7f8f3;
        stroke: #7d9a8c;
        stroke-width: 2;
        stroke-dasharray: 4 3;
      }
      .graph-node.context.area circle {
        fill: #dcebe3;
      }
      .graph-node.context text {
        fill: #5d7468;
      }
      .graph-node.st-needs-recheck circle {
        fill: #ee8a00;
        stroke: #7a4300;
        stroke-width: 4;
      }
      .graph-node.st-needs-decision circle {
        fill: #5a3fc8;
        stroke: #2c1d80;
        stroke-width: 4;
      }
      .graph-node.st-accepted circle {
        fill: #5fa88f;
      }
      .graph-node.st-deferred circle {
        fill: #c9c9b8;
      }
      .graph-node.st-rejected circle {
        fill: #f1dedb;
        stroke: #a04740;
      }
      .graph-node.st-done circle {
        fill: #e3f1e6;
        stroke: #286e60;
      }
      .graph-node.st-duplicate circle {
        fill: #e6e6e6;
        stroke: #999;
      }
      .graph-node.selected circle,
      .graph-node.selected rect {
        stroke: #14352e;
        stroke-width: 5;
      }
      .graph-node text {
        font-size: 12px;
        fill: #334e42;
        paint-order: stroke;
        stroke: #f0f4ee;
        stroke-width: 4px;
        stroke-linejoin: round;
      }
      .tools {
        position: absolute;
        right: 12px;
        bottom: 12px;
        display: flex;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 7px;
      }
      .tools button {
        color: var(--ink);
        min-width: 36px;
      }
      .tools button:hover {
        background: var(--pale);
      }
      .reader-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 26px;
      }
      .badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 4px;
        background: #e9f2eb;
        color: #366c54;
        font-size: 12px;
        font-weight: 650;
      }
      .badge.pending {
        background: #fbefd9;
        color: #815314;
      }
      .badge.outdated {
        background: #fff;
        color: #7a4300;
        border: 1px dashed #b86a00;
        padding: 3px 7px;
      }
      .badge.st-needs-recheck {
        background: #ee8a00;
        color: #1d1200;
      }
      .badge.st-needs-decision {
        background: #5a3fc8;
        color: #fff;
      }
      .badge.st-accepted {
        background: #d6ecdf;
        color: #1f5a43;
      }
      .badge.st-deferred {
        background: #ececdf;
        color: #55553f;
      }
      .badge.st-rejected {
        background: #f4e0dd;
        color: #8a342d;
      }
      .badge.st-done {
        background: #e3f1e6;
        color: #2d6a3a;
      }
      .badge.st-duplicate {
        background: #ececec;
        color: #555;
      }
      .badge.conflict {
        background: #f8e5e2;
        color: #913d37;
      }
      .badge.stale {
        background: #eee8f3;
        color: #6f5481;
      }
      .meta {
        color: var(--muted);
        font-size: 13px;
        margin: 14px 0 22px;
      }
      .article {
        line-height: 1.7;
        overflow-wrap: anywhere;
      }
      .article h1,
      .article h2,
      .article h3 {
        margin: 24px 0 10px;
      }
      .article h1 {
        font-size: 21px;
      }
      .article p,
      .article ul,
      .article ol,
      .article pre {
        margin: 0 0 14px;
      }
      .article ul,
      .article ol {
        padding-left: 22px;
      }
      .article code {
        background: #eef3ee;
        border-radius: 3px;
        padding: 1px 4px;
        font-size: 0.9em;
      }
      .article pre {
        background: #eef3ee;
        padding: 12px;
        overflow: auto;
        border-radius: 6px;
      }
      .article pre code {
        padding: 0;
      }
      .article a,
      .wiki {
        color: var(--teal);
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .wiki {
        border: 0;
        padding: 0;
        background: none;
        font: inherit;
        text-align: left;
      }
      .reading {
        display: grid;
        grid-template-columns: 290px minmax(0, 1fr);
        height: calc(100vh - 70px - 48px);
        min-height: 0;
        background: var(--white);
      }
      .outline {
        overflow: auto;
        padding: 20px 14px 40px 20px;
        border-right: 1px solid var(--line);
        background: var(--paper);
      }
      .outline button {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        background: none;
        padding: 6px 10px;
        border-radius: 7px;
        line-height: 1.35;
      }
      .outline button:hover {
        background: var(--pale);
      }
      .outline button[aria-current="true"] {
        background: var(--pale);
        color: var(--teal);
        font-weight: 650;
      }
      .outline .outline-home {
        font-weight: 700;
        margin: 16px 0 4px;
      }
      .outline .outline-area {
        font-weight: 650;
        margin-top: 14px;
      }
      .outline .outline-note {
        padding-left: 22px;
        font-size: 14px;
        color: #3d5249;
      }
      .page {
        overflow: auto;
        padding: 44px 56px 90px;
      }
      .page-body {
        max-width: 760px;
        margin: 0 auto;
      }
      .page-body > h1 {
        font-size: 32px;
        line-height: 1.2;
        letter-spacing: -0.01em;
        margin: 0 0 14px;
      }
      .page-body > h2 {
        font-size: 21px;
        margin: 40px 0 6px;
      }
      .page-body h2 .wiki {
        color: var(--ink);
        text-decoration: none;
      }
      .page-body h2 .wiki:hover {
        color: var(--teal);
        text-decoration: underline;
      }
      .page .lead {
        font-size: 18px;
        line-height: 1.6;
        color: #2b443c;
        margin: 0 0 26px;
      }
      .page .area-summary {
        color: #45594f;
        margin: 0 0 6px;
      }
      .crumbs {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 18px;
      }
      .crumbs .wiki {
        text-decoration: none;
      }
      .feature {
        padding: 13px 0;
        border-top: 1px solid var(--line);
      }
      .feature-title {
        border: 0;
        background: none;
        padding: 0;
        font-weight: 650;
        font-size: 16px;
        text-align: left;
      }
      .feature-title:hover {
        color: var(--teal);
        text-decoration: underline;
      }
      .feature p {
        margin: 4px 0 0;
        color: #45594f;
      }
      .quiet {
        font-size: 13px;
        color: var(--muted);
      }
      .feature .quiet {
        display: block;
        margin-top: 4px;
      }
      .related {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 8px 0 28px;
      }
      .chip {
        border: 1px solid var(--line);
        background: var(--paper);
        border-radius: 999px;
        padding: 4px 12px;
        font-size: 14px;
      }
      .chip:hover {
        border-color: var(--teal);
        color: var(--teal);
      }
      .label {
        font-size: 12px;
        font-weight: 650;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 26px 0 0;
      }
      .page details {
        border-top: 1px solid var(--line);
        padding: 12px 0;
      }
      .page details + details {
        margin-top: 0;
      }
      .page .fold-start {
        margin-top: 34px;
      }
      .page summary {
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
        color: #45594f;
      }
      .page details[open] > summary {
        margin-bottom: 12px;
      }
      .tech {
        display: grid;
        grid-template-columns: 110px minmax(0, 1fr);
        gap: 6px 14px;
        font-size: 13px;
        margin: 0;
        overflow-wrap: anywhere;
      }
      .tech dt {
        color: var(--muted);
      }
      .tech dd {
        margin: 0;
      }
      @media (max-width: 760px) {
        .reading {
          display: block;
          height: auto;
        }
        .outline {
          border-right: 0;
          border-bottom: 1px solid var(--line);
          max-height: 40vh;
        }
        .page {
          padding: 26px 18px 60px;
        }
        .page-body > h1 {
          font-size: 26px;
        }
      }
      .empty {
        color: var(--muted);
        padding: 20px 0;
      }
      .mobile-tabs {
        display: none;
      }
      .stale-note {
        background: #f2ebf5;
        color: #654e72;
        padding: 10px 12px;
        border-radius: 6px;
        font-size: 13px;
        margin-bottom: 18px;
      }
      @media (max-width: 1000px) {
        .workspace {
          grid-template-columns: 230px minmax(0, 1fr);
        }
        .reader {
          padding: 26px 24px 60px;
        }
        .map {
          overflow: auto;
        }
        .graph-wrap {
          flex: 1 0 180px;
        }
      }
      @media (max-width: 650px) {
        header {
          height: auto;
          min-height: 64px;
          padding: 12px 16px;
        }
        .modebar {
          padding: 7px 16px;
        }
        .modebar .hint {
          display: none;
        }
        .modebar button {
          flex: 1;
          justify-content: center;
        }
        .header-note {

      @media (prefers-reduced-motion: reduce) {

  <body>
    <header>
      <div class="brand">

      </div>

      </div>
    </header>
    <div class="modebar" role="group" aria-label="Layer">

      ><button type="button" id="mode-spec" aria-pressed="false">Map</button
      ><button type="button" id="mode-gaps" aria-pressed="false">

    <nav class="mobile-tabs" aria-label="Sections">

    <script id="knowledge-data" type="application/json">
      __KNOWLEDGE_DATA__
    </script>
    <script>
      (() => {
        "use strict";
        const data = JSON.parse(
          document.getElementById("knowledge-data").textContent,
        );
        const nodes = (Array.isArray(data.nodes) ? data.nodes : []).filter(
            (n) => n && typeof n === "object",
          ),
          edges = Array.isArray(data.edges) ? data.edges : [];
        const byId = new Map(nodes.map((n) => [n.id, n])),
          byPath = new Map(
            nodes.map((n) => [String(n.path || "").replace(/\.md$/i, ""), n]),
          );
        const $ = (s) => document.querySelector(s),
          svgNS = "http://www.w3.org/2000/svg";
        const workspace = $(".workspace"),
          list = $("#list"),
          graph = $("#graph"),
          detail = $("#detail");
        let mode = "read",
          readPage = null, // the spec page open in Read; null is the overview
          filter = "all",
          gapState = "all",
          selected = null,
          box = { x: 0, y: 0, w: 1000, h: 700 },
          initialBox = { ...box };
        const labels = {
          current: "Supported by sources",
          partial: "Partial",
          planned: "Planned",
          unverified: "Unverified",
          conflict: "Conflict",
          stale: "Stale",
          superseded: "Superseded",
        };
        const types = {
          index: "Overview",
          area: "Area",
          note: "Note",
          gap: "Gap",
          plan: "Plan",
          run: "Research run",
        };
        const kindLabels = {
          "product-gap": "Product gap",
          "verification-gap": "Verification gap",
          "product-plan": "Product plan",
          conflict: "Conflict",
          "knowledge-gap": "Knowledge gap",
        };
        const STATES = [
          "needs-recheck",
          "needs-decision",
          "accepted",
          "deferred",
          "rejected",
          "done",
          "duplicate",
        ];
        const stateLabels = {
          "needs-recheck": "Needs recheck",
          "needs-decision": "Needs decision",
          accepted: "Accepted",
          deferred: "Deferred",
          rejected: "Rejected",
          done: "Done",
          duplicate: "Duplicate",
        };
        const stateHints = {
          "needs-recheck":
            "Someone has to confirm that the page's description of the current code is still right.",
          "needs-decision":
            "Rechecked; waiting for a person to accept, reject or defer.",
        };
        const recheckLabels = {
          "not-checked": "Not checked",
          confirmed: "Confirmed (still holds)",
          "not-reproduced": "Not reproduced (no longer holds)",
          outdated: "Outdated",
        };
        // model:start
        const str = (v) => (typeof v === "string" ? v : "");
        const isGap = (n) => n.type === "gap";
        const isPlan = (n) => n.type === "plan";
        const layerOf = (n) =>
          ["spec", "gap", "nav"].includes(n.layer)
            ? n.layer
            : n.type === "area" || n.type === "note"
              ? "spec"
              : isGap(n) || isPlan(n)
                ? "gap"
                : "nav";
        const stateOf = (n) => {
          if (!isGap(n)) return "";
          if (STATES.includes(n.state)) return n.state;
          const decision = str(n.decision) || "open",
            recheck = str(n.recheck);
          if (decision === "open")
            return recheck === "confirmed" || recheck === "not-reproduced"
              ? "needs-decision"
              : "needs-recheck";
          return STATES.includes(decision) ? decision : "needs-recheck";
        };
        const recheckOutdated = (n) =>
          isGap(n) && (n.recheckOutdated === true || n.recheck === "outdated");
        const stateRank = (n) => {
          const i = STATES.indexOf(stateOf(n));
          return i < 0 ? STATES.length : i;
        };
        const stateClass = (n) =>
          isGap(n)
            ? "st-" + stateOf(n)
            : n.stale || n.status === "stale"
              ? "stale"
              : n.status === "conflict"
                ? "conflict"
                : ["planned", "unverified"].includes(n.status)
                  ? "pending"
                  : "";
        const inArea = (n, area) =>
          !area || n.id === area || (n.areas || []).includes(area);
        const byTitle = (a, b) =>
          String(a.title || "").localeCompare(String(b.title || ""), "ru");
        // model:end
        const el = (tag, text, cls) => {
          const e = document.createElement(tag);
          if (text != null) e.textContent = text;
          if (cls) e.className = cls;
          return e;
        };
        const sv = (tag, attrs) => {
          const e = document.createElementNS(svgNS, tag);
          Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v));
          return e;
        };
        const viewButtons = () =>
          document.querySelectorAll(".mobile-tabs button, .viewtabs button");
        function switchView(view) {
          workspace.dataset.view = view;
          viewButtons().forEach((b) =>
            b.setAttribute(
              "aria-selected",
              String(b.dataset.view === view || b.dataset.alt === view),
            ),
          );
        }
        viewButtons()
          .forEach((b) =>
            b.addEventListener("click", () => switchView(b.dataset.view)),
          );
        $("#project-title").textContent = data.title || "Knowledge map";
        document.title = (data.title || "Knowledge map") + " — navigator";
        const areas = nodes
          .filter((n) => n.type === "area")
          .sort(byTitle);
        areas.forEach((n) => {
          const o = el("option", n.title);
          o.value = n.id;
          $("#area").append(o);
        });
        const kindSet = Object.keys(kindLabels);
        nodes.forEach((n) => {
          if (isGap(n) && str(n.kind) && !kindSet.includes(n.kind))
            kindSet.push(n.kind);
        });
        kindSet.forEach((k) => {
          const o = el("option", kindLabels[k] || k);
          o.value = k;
          $("#kind").append(o);
        });

        // Controls are built once and updated in place so keyboard focus is kept.
        const modeButtons = {
          read: $("#mode-read"),
          spec: $("#mode-spec"),
          gap: $("#mode-gaps"),
        };
        const specFilters = [
          ["all", "All"],
          ["area", "Areas"],
          ["note", "Notes"],
        ].map(([f, text]) => {
          const b = el("button", text);
          b.type = "button";
          b.setAttribute("aria-pressed", "false");
          b.addEventListener("click", () => {
            filter = f;
            render();
          });
          $("#spec-filters").append(b);
          return [f, b];
        });
        const stateButtons = ["all", ...STATES].map((s) => {
          const b = el("button");
          b.type = "button";
          b.setAttribute("aria-pressed", "false");
          if (s !== "all") b.append(el("span", null, "dot st-" + s));
          b.append(
            document.createTextNode(s === "all" ? "All" : stateLabels[s]),
          );
          const n = el("span", "0", "n");
          b.append(n);
          if (stateHints[s]) b.title = stateHints[s];
          b.addEventListener("click", () => setGapState(s));
          $("#state-filters").append(b);
          return [s, b, n];
        });
        const countDefs = {
          spec: [
            ["all", "materials", () => nodes.filter((n) => layerOf(n) !== "gap").length],
            ["note", "notes", () => nodes.filter((n) => n.type === "note").length],
            ["area", "areas", () => nodes.filter((n) => n.type === "area").length],
          ],
          gap: [
            ["needs-recheck", "need recheck", () => nodes.filter((n) => stateOf(n) === "needs-recheck").length],
            ["needs-decision", "need a decision", () => nodes.filter((n) => stateOf(n) === "needs-decision").length],
            ["all", "gaps", () => nodes.filter(isGap).length],
          ],
        };
        const countButtons = [];
        Object.entries(countDefs).forEach(([m, defs]) =>
          defs.forEach(([key, text, fn]) => {
            const b = el("button"),
              num = el("b", "0");
            b.type = "button";
            b.append(num, document.createTextNode(text));
            b.addEventListener("click", () => {
              if (m === "spec") filter = key;
              else gapState = key;
              render();
              switchView("list");
            });
            $("#counts").append(b);
            countButtons.push({ mode: m, button: b, num, fn });
          }),
        );
        function setGapState(s) {
          gapState = s;
          render();
        }
        function resetGapFilters() {
          gapState = "all";
          $("#kind").value = "";
          $("#search").value = "";
          $("#area").value = "";
        }
        function setMode(m) {
          if (m === mode) return;
          mode = m;
          // A page left open from the other layer would hide the list's graph.
          if (m !== "read") switchView("map");
          render(false);
        }
        modeButtons.read.addEventListener("click", () => {
          // Keep the reader on the page they were looking at.
          if (mode !== "read" && selected && layerOf(selected) === "spec")
            readPage = selected;
          setMode("read");
        });
        modeButtons.spec.addEventListener("click", () => {
          if (mode === "read" && readPage) {
            mode = "spec";
            showDetail(readPage);
            switchView("map");
          } else setMode("spec");
        });
        modeButtons.gap.addEventListener("click", () => setMode("gap"));
        $("#read-search").addEventListener("input", () => render());
        $("#search").addEventListener("input", () => render());
        $("#area").addEventListener("change", () => render());
        $("#kind").addEventListener("change", () => render());

        function matchesQuery(n) {
          const q = $("#search").value.trim().toLocaleLowerCase();
          return (
            !q ||
            (str(n.title) + " " + str(n.body)).toLocaleLowerCase().includes(q)
          );
        }
        // Gaps that pass area, kind and search (not state).
        function gapPool() {
          const area = $("#area").value,
            kind = $("#kind").value;
          return nodes.filter(
            (n) =>
              isGap(n) &&
              inArea(n, area) &&
              (!kind || n.kind === kind) &&
              matchesQuery(n),
          );
        }
        function visible() {
          if (mode === "gap")
            return gapPool()
              .filter((n) => gapState === "all" || stateOf(n) === gapState)
              .sort((a, b) => stateRank(a) - stateRank(b) || byTitle(a, b));
          const area = $("#area").value;
          return nodes.filter(
            (n) =>
              layerOf(n) !== "gap" &&
              inArea(n, area) &&
              (filter === "all" || n.type === filter) &&
              matchesQuery(n),
          );
        }
        function splitWiki(raw) {
          const parts = String(raw).replace(/\\\|/g, "|").split("|");
          return {
            target: parts[0]
              .split("#")[0]
              .split("^")[0]
              .trim()
              .replace(/\.md$/i, ""),
            label: (parts[1] || "").trim() || parts[0].trim(),
          };
        }
        function resolveWiki(raw) {
          const target = splitWiki(raw).target;
          if (!target) return selected;
          if (target.includes("/")) return byPath.get(target) || null;
          const matches = nodes.filter(
            (n) =>
              String(n.path || "")
                .replace(/\.md$/i, "")
                .split("/")
                .pop() === target,
          );
          return matches.length === 1 ? matches[0] : null;
        }
        function safeHref(raw, n) {
          try {
            const trimmed = raw.trim();
            if (!trimmed || /[\u0000-\u001f]/.test(trimmed)) return null;
            const url = new URL(
              trimmed,
              new URL(n.path || "", document.baseURI),
            );
            return ["http:", "https:", "file:", "mailto:"].includes(
              url.protocol,
            )
              ? url.href
              : null;
          } catch {
            return null;
          }
        }
        function inline(parent, text, n) {
          const re = /(\[\[[^\]]+\]\]|\[[^\]]+\]\([^\s)]+\)|`[^`]+`|\*\*[^*\n]+\*\*)/g;
          let last = 0,
            m;
          while ((m = re.exec(text))) {
            parent.append(document.createTextNode(text.slice(last, m.index)));
            const token = m[0];
            if (token.startsWith("[[")) {
              const raw = token.slice(2, -2),
                target = resolveWiki(raw),
                label = splitWiki(raw).label;
              if (target) {
                const b = el("button", label, "wiki");
                b.type = "button";
                b.addEventListener("click", () => openNode(target));
                parent.append(b);
              } else parent.append(document.createTextNode(token));
            } else if (token.startsWith("**")) {
              const strong = el("strong");
              inline(strong, token.slice(2, -2), n);
              parent.append(strong);
            } else if (token.startsWith("`"))
              parent.append(el("code", token.slice(1, -1)));
            else {
              const parts = token.match(/^\[([^\]]+)\]\(([^)]+)\)$/),
                href = parts && safeHref(parts[2], n);
              if (href) {
                const a = el("a", parts[1]);
                a.href = href;
                parent.append(a);
              } else parent.append(document.createTextNode(token));
            }
            last = re.lastIndex;
          }
          parent.append(document.createTextNode(text.slice(last)));
        }
        function markdown(body, n) {
          const container = el("div", null, "article"),
            lines = String(body || "").split(/\r?\n/);
          let paragraph = [],
            listEl = null,
            code = null;
          function flush() {
            if (paragraph.length) {
              const p = el("p");
              inline(p, paragraph.join(" "), n);
              container.append(p);
              paragraph = [];
            }
            listEl = null;
          }
          function emitCode() {
            const pre = el("pre"),
              c = el("code", code.lines.join("\n"));
            pre.append(c);
            container.append(pre);
            code = null;
          }
          for (const line of lines) {
            if (code) {
              // CommonMark: a closing fence uses the same character, is at
              // least as long as the opener and has no info string.
              const close = line.match(/^\s*(`{3,}|~{3,})\s*$/);
              if (
                close &&
                close[1][0] === code.ch &&
                close[1].length >= code.len
              )
                emitCode();
              else code.lines.push(line);
              continue;
            }
            const open = line.match(/^\s*(`{3,}|~{3,})(.*)$/);
            // A backtick fence's info string cannot contain a backtick.
            if (open && !(open[1][0] === "`" && open[2].includes("`"))) {
              flush();
              code = { ch: open[1][0], len: open[1].length, lines: [] };
              continue;
            }
            if (!line.trim()) {
              flush();
              continue;
            }
            const h = line.match(/^(#{1,6})\s+(.+)$/),
              li = line.match(/^\s*([-*+]\s+|\d+[.)]\s+)(.*)$/);
            if (h) {
              flush();
              const e = el("h" + Math.min(h[1].length, 6));
              inline(e, h[2], n);
              container.append(e);
            } else if (li) {
              if (paragraph.length) flush();
              const kind = /^\d/.test(li[1]) ? "ol" : "ul";
              if (!listEl || listEl.tagName.toLowerCase() !== kind) {
                listEl = el(kind);
                container.append(listEl);
              }
              const item = el("li");
              inline(item, li[2], n);
              listEl.append(item);
            } else {
              listEl = null;
              paragraph.push(line);
            }
          }
          flush();
          if (code) emitCode();
          return container;
        }
        const outdatedBadge = () =>
          el("span", "Recheck outdated", "badge outdated");
        function stateBadge(n) {
          return el("span", stateLabels[stateOf(n)], "badge " + stateClass(n));
        }
        function neighbours(n, layer) {
          const out = new Map();
          edges.forEach((e) => {
            const other =
              e.source === n.id
                ? byId.get(e.target)
                : e.target === n.id
                  ? byId.get(e.source)
                  : null;
            if (other && other.id !== n.id && layerOf(other) === layer)
              out.set(other.id, other);
          });
          return [...out.values()].sort(byTitle);
        }
        function gapsAbout(n) {
          const out = new Map();
          edges.forEach((e) => {
            // Gaps link to spec pages; older vaults also had the reverse edge.
            const g =
              e.target === n.id
                ? byId.get(e.source)
                : e.source === n.id
                  ? byId.get(e.target)
                  : null;
            if (g && isGap(g)) out.set(g.id, g);
          });
          return [...out.values()].sort(
            (a, b) => stateRank(a) - stateRank(b) || byTitle(a, b),
          );
        }
        const planOf = (g) => nodes.find((p) => isPlan(p) && p.gap === g.id);
        const byWhom = (who, on) =>
          (who ? " by " + who : "") + (on ? " on " + on : "");
        function factsLine(n) {
          const parts = [];
          if (str(n.recheckedBy) || str(n.recheckedOn))
            parts.push(
              "Rechecked" + byWhom(str(n.recheckedBy), str(n.recheckedOn)),
            );
          if (str(n.decidedBy) || str(n.decidedOn))
            parts.push(
              "Decided" + byWhom(str(n.decidedBy), str(n.decidedOn)),
            );
          if (str(n.priority)) parts.push("Priority " + n.priority);
          return parts.join(" · ");
        }
        function nodeButton(target, text) {
          const b = el("button", text == null ? target.title : text, "wiki");
          b.type = "button";
          b.addEventListener("click", () => openNode(target));
          return b;
        }
        function linkBlock(title, items) {
          const block = el("div", null, "link-block"),
            ul = el("ul", null, "link-list");
          block.append(el("h2", title), ul);
          items.forEach((fn) => {
            const li = el("li");
            fn(li);
            ul.append(li);
          });
          return block;
        }
        function gapHeader(n) {
          const box = el("div", null, "gap-facts " + stateClass(n)),
            dl = el("dl");
          const row = (k, v) => {
            const dd = el("dd");
            if (typeof v === "string") dd.textContent = v;
            else dd.append(v);
            dl.append(el("dt", k), dd);
          };

          graph.classList.remove("dragging");
        });
        graph.addEventListener("pointercancel", () => {
          drag = null;
          graph.classList.remove("dragging");
        });
        render();
      })();
    </script>
  </body>
</html>
