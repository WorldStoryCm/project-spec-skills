<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Knowledge map</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #203832;
        --muted: #65756e;
        --line: #dce4dd;
        --paper: #f7f8f3;
        --white: #fff;
        --teal: #286e60;
        --pale: #e8f1eb;
        --amber: #9a641b;
        --red: #a04740;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          15px/1.5 system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      a:focus-visible,
      [tabindex]:focus-visible {
        outline: 3px solid #6aa994;
        outline-offset: 2px;
      }
      header {
        height: 70px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
        border-bottom: 1px solid var(--line);
        gap: 20px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        background: var(--teal);
        color: white;
        border-radius: 9px;
        font-weight: 700;
      }
      .brand strong {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .brand small,
      .subtle {
        color: var(--muted);
      }
      .header-note {
        font-size: 13px;
        color: var(--muted);
        text-align: right;
      }
      .workspace {
        display: grid;
        grid-template-columns: 270px minmax(340px, 1fr) 360px;
        height: calc(100vh - 70px - 48px);
        min-height: 0;
        grid-template-rows: minmax(0, 1fr);
      }
      aside,
      .reader {
        background: #fff;
        padding: 24px;
        min-width: 0;
      }
      aside {
        border-right: 1px solid var(--line);
        overflow: auto;
        min-height: 0;
      }
      .reader {
        border-left: 1px solid var(--line);
        overflow: auto;
        min-height: 0;
      }
      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }
      h1 {
        font-size: 24px;
        line-height: 1.2;
        letter-spacing: -0.03em;
        margin-bottom: 8px;
      }
      h2 {
        font-size: 17px;
        line-height: 1.3;
        margin-bottom: 12px;
      }
      h3 {
        font-size: 15px;
      }
      .section-label {
        font-weight: 650;
        font-size: 13px;
        margin: 22px 0 9px;
      }
      .search {
        width: 100%;
        border: 1px solid #cedbd2;
        border-radius: 7px;
        padding: 10px 12px;
        background: #fafcf9;
      }
      .search::placeholder {
        color: #829089;
      }
      select {
        width: 100%;
        border: 1px solid #cedbd2;
        border-radius: 7px;
        background: #fff;
        padding: 9px;
      }
      .filters {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }
      .filters button,
      .tools button {
        border: 0;
        background: transparent;
        border-radius: 6px;
        padding: 7px 9px;
        color: var(--muted);
      }
      .filters button[aria-pressed="true"] {
        background: var(--pale);
        color: var(--teal);
        font-weight: 650;
      }
      .list {
        margin-top: 12px;
        display: grid;
        gap: 3px;
      }
      .item {
        display: block;
        width: 100%;
        text-align: left;
        background: transparent;
        border: 0;
        border-radius: 7px;
        padding: 10px;
        color: var(--ink);
      }
      .item:hover,
      .item[aria-current="true"] {
        background: #edf4ef;
      }
      .item strong {
        font-size: 14px;
        display: block;
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .item small {
        color: var(--muted);
      }
      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--teal);
        margin-right: 7px;
      }
      .dot.pending {
        background: #be8230;
      }
      .dot.conflict {
        background: var(--red);
      }
      .dot.stale {
        background: #826b9a;
      }
      .dot.st-needs-recheck {
        background: #ee8a00;
        box-shadow: 0 0 0 2px #fde3b8;
      }
      .dot.st-needs-decision {
        background: #5a3fc8;
        box-shadow: 0 0 0 2px #dcd5f6;
      }
      .dot.st-accepted {
        background: #5fa88f;
      }
      .dot.st-deferred {
        background: #b4b4a2;
      }
      .dot.st-rejected {
        background: #fff;
        border: 2px solid #a04740;
      }
      .dot.st-done {
        background: #fff;
        border: 2px solid #286e60;
      }
      .dot.st-duplicate {
        background: #d9d9d9;
      }
      [hidden] {
        display: none !important;
      }
      .modebar {
        height: 48px;
        display: flex;
        align-items: stretch;
        gap: 8px;
        padding: 7px 28px;
        background: #fff;
        border-bottom: 3px solid var(--teal);
      }
      body[data-mode="gaps"] .modebar {
        border-bottom-color: #5a3fc8;
      }
      .modebar button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid #cedbd2;
        background: #fff;
        border-radius: 7px;
        padding: 0 14px;
        font-weight: 650;
        color: var(--muted);
      }
      .modebar button[aria-pressed="true"] {
        background: var(--teal);
        border-color: var(--teal);
        color: #fff;
      }
      body[data-mode="gaps"] .modebar button[aria-pressed="true"] {
        background: #5a3fc8;
        border-color: #5a3fc8;
      }
      .modebar .hint {
        align-self: center;
        margin-left: 6px;
        font-size: 13px;
        color: var(--muted);
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pill {
        background: #ee8a00;
        color: #1d1200;
        border-radius: 10px;
        padding: 0 7px;
        font-size: 12px;
        line-height: 18px;
      }
      .state-filters button {
        display: inline-flex;
        align-items: center;
        gap: 2px;
      }
      .state-filters .n {
        margin-left: 4px;
        font-variant-numeric: tabular-nums;
        opacity: 0.8;
      }
      .filters button[aria-pressed="true"] {
        outline: 1px solid #b6d3c3;
      }
      .item .row2 {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 3px;
      }
      .item .facts-line {
        display: block;
        margin-top: 3px;
        font-size: 12px;
      }
      .section-label.sub {
        font-weight: 600;
        color: var(--muted);
      }
      .gap-facts {
        margin: 0 0 18px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-left: 5px solid #b4b4a2;
        border-radius: 6px;
        background: #fafcf9;
        font-size: 13px;
      }
      .gap-facts.st-needs-recheck {
        border-left-color: #ee8a00;
      }
      .gap-facts.st-needs-decision {
        border-left-color: #5a3fc8;
      }
      .gap-facts dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 4px 12px;
        margin: 0;
      }
      .gap-facts dt {
        color: var(--muted);
      }
      .gap-facts dd {
        margin: 0;
        min-width: 0;
      }
      .link-list {
        list-style: none;
        margin: 0 0 18px;
        padding: 0;
        display: grid;
        gap: 4px;
      }
      .link-list li {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }
      .link-block {
        margin: 0 0 18px;
      }
      .link-block h2 {
        font-size: 13px;
        margin: 0 0 6px;
        color: var(--muted);
      }
      .hintline {
        font-size: 12px;
        margin: 12px 0 0;
      }
      .map {
        padding: 26px;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .map-head {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 15px;
      }
      .map-head p {
        max-width: 570px;
        color: var(--muted);
        font-size: 13px;
      }
      .counts {
        display: flex;
        gap: 20px;
        margin: 10px 0 20px;
      }
      .counts button {
        border: 0;
        background: none;
        padding: 0;
        text-align: left;
        color: var(--muted);
        font-size: 13px;
      }
      .counts b {
        display: block;
        color: var(--ink);
        font-size: 21px;
      }
      .graph-wrap {
        position: relative;
        flex: 1;
        min-height: 180px;
        background: #f0f4ee;
        border: 1px solid #e0e9df;
        border-radius: 10px;
        overflow: hidden;
      }
      .graph-wrap svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: grab;
      }
      .graph-wrap svg.dragging {
        cursor: grabbing;
      }
      .graph-wrap line {
        stroke: #b9cfc0;
        stroke-width: 1.5;
      }
      .graph-node {
        cursor: pointer;
      }
      .graph-node circle {
        fill: #b6d3c3;
        stroke: #fff;
        stroke-width: 3;
      }
      .graph-node rect {
        fill: #b6d3c3;
        stroke: #fff;
        stroke-width: 3;
      }
      .graph-node.area circle {
        fill: #327969;
      }
      .graph-node.pending circle {
        fill: #d3a05b;
      }
      .graph-node.conflict circle {
        fill: #c16a61;
      }
      .graph-node.stale circle {
        stroke: #826b9a;
      }
      .graph-node.plan-node rect {
        fill: #cfe3f2;
        stroke: #3d6f95;
      }
      .graph-node.context circle {
        fill: #f7f8f3;
        stroke: #7d9a8c;
        stroke-width: 2;
        stroke-dasharray: 4 3;
      }
      .graph-node.context.area circle {
        fill: #dcebe3;
      }
      .graph-node.context text {
        fill: #5d7468;
      }
      .graph-node.st-needs-recheck circle {
        fill: #ee8a00;
        stroke: #7a4300;
        stroke-width: 4;
      }
      .graph-node.st-needs-decision circle {
        fill: #5a3fc8;
        stroke: #2c1d80;
        stroke-width: 4;
      }
      .graph-node.st-accepted circle {
        fill: #5fa88f;
      }
      .graph-node.st-deferred circle {
        fill: #c9c9b8;
      }
      .graph-node.st-rejected circle {
        fill: #f1dedb;
        stroke: #a04740;
      }
      .graph-node.st-done circle {
        fill: #e3f1e6;
        stroke: #286e60;
      }
      .graph-node.st-duplicate circle {
        fill: #e6e6e6;
        stroke: #999;
      }
      .graph-node.selected circle,
      .graph-node.selected rect {
        stroke: #14352e;
        stroke-width: 5;
      }
      .graph-node text {
        font-size: 12px;
        fill: #334e42;
        paint-order: stroke;
        stroke: #f0f4ee;
        stroke-width: 4px;
        stroke-linejoin: round;
      }
      .tools {
        position: absolute;
        right: 12px;
        bottom: 12px;
        display: flex;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 7px;
      }
      .tools button {
        color: var(--ink);
        min-width: 36px;
      }
      .tools button:hover {
        background: var(--pale);
      }
      .reader-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 26px;
      }
      .badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 4px;
        background: #e9f2eb;
        color: #366c54;
        font-size: 12px;
        font-weight: 650;
      }
      .badge.pending {
        background: #fbefd9;
        color: #815314;
      }
      .badge.outdated {
        background: #fff;
        color: #7a4300;
        border: 1px dashed #b86a00;
        padding: 3px 7px;
      }
      .badge.st-needs-recheck {
        background: #ee8a00;
        color: #1d1200;
      }
      .badge.st-needs-decision {
        background: #5a3fc8;
        color: #fff;
      }
      .badge.st-accepted {
        background: #d6ecdf;
        color: #1f5a43;
      }
      .badge.st-deferred {
        background: #ececdf;
        color: #55553f;
      }
      .badge.st-rejected {
        background: #f4e0dd;
        color: #8a342d;
      }
      .badge.st-done {
        background: #e3f1e6;
        color: #2d6a3a;
      }
      .badge.st-duplicate {
        background: #ececec;
        color: #555;
      }
      .badge.conflict {
        background: #f8e5e2;
        color: #913d37;
      }
      .badge.stale {
        background: #eee8f3;
        color: #6f5481;
      }
      .meta {
        color: var(--muted);
        font-size: 13px;
        margin: 14px 0 22px;
      }
      .article {
        line-height: 1.7;
        overflow-wrap: anywhere;
      }
      .article h1,
      .article h2,
      .article h3 {
        margin: 24px 0 10px;
      }
      .article h1 {
        font-size: 21px;
      }
      .article p,
      .article ul,
      .article ol,
      .article pre {
        margin: 0 0 14px;
      }
      .article ul,
      .article ol {
        padding-left: 22px;
      }
      .article code {
        background: #eef3ee;
        border-radius: 3px;
        padding: 1px 4px;
        font-size: 0.9em;
      }
      .article pre {
        background: #eef3ee;
        padding: 12px;
        overflow: auto;
        border-radius: 6px;
      }
      .article pre code {
        padding: 0;
      }
      .article a,
      .wiki {
        color: var(--teal);
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .wiki {
        border: 0;
        padding: 0;
        background: none;
        font: inherit;
        text-align: left;
      }
      .empty {
        color: var(--muted);
        padding: 20px 0;
      }
      .mobile-tabs {
        display: none;
      }
      .stale-note {
        background: #f2ebf5;
        color: #654e72;
        padding: 10px 12px;
        border-radius: 6px;
        font-size: 13px;
        margin-bottom: 18px;
      }
      @media (max-width: 1000px) {
        .workspace {
          grid-template-columns: 230px minmax(300px, 1fr);
          grid-template-rows: minmax(0, 3fr) minmax(0, 2fr);
        }
        .reader {
          grid-column: 1/-1;
          border-left: 0;
          border-top: 1px solid var(--line);
        }
        .map {
          overflow: auto;
        }
        .graph-wrap {
          flex: 1 0 180px;
        }
      }
      @media (max-width: 650px) {
        header {
          height: auto;
          min-height: 64px;
          padding: 12px 16px;
        }
        .modebar {
          padding: 7px 16px;
        }
        .modebar .hint {
          display: none;
        }
        .modebar button {
          flex: 1;
          justify-content: center;
        }
        .header-note {
          display: none;
        }
        .mobile-tabs {
          display: flex;
          background: #fff;
          padding: 0 16px;
          gap: 16px;
          border-bottom: 1px solid var(--line);
        }
        .mobile-tabs button {
          border: 0;
          border-bottom: 2px solid transparent;
          background: none;
          padding: 12px 2px;
          color: var(--muted);
        }
        .mobile-tabs button[aria-selected="true"] {
          border-color: var(--teal);
          color: var(--teal);
          font-weight: 650;
        }
        .workspace {
          display: block;
          height: auto;
          min-height: 0;
        }
        .workspace > aside,
        .workspace > .map,
        .workspace > .reader {
          display: none;
        }
        .workspace[data-view="list"] > aside,
        .workspace[data-view="map"] > .map,
        .workspace[data-view="reader"] > .reader {
          display: block;
        }
        aside,
        .reader,
        .map {
          padding: 20px 16px;
          border: 0;
        }
        .reader {
          max-height: none;
        }
        .map {
          overflow: visible;
        }
        .graph-wrap {
          height: 420px;
        }
        .map-head {
          display: block;
        }
        .counts {
          margin-bottom: 16px;
          flex-wrap: wrap;
          gap: 10px 20px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="mark" aria-hidden="true">✳</span>
        <div>
          <strong id="project-title">Knowledge map</strong
          ><small>Project navigator</small>
        </div>
      </div>
      <div class="header-note">
        As-built spec and gaps<br />Generated locally
      </div>
    </header>
    <div class="modebar" role="group" aria-label="Layer">
      <button type="button" id="mode-spec" aria-pressed="true">Spec</button
      ><button type="button" id="mode-gaps" aria-pressed="false">
        Gaps<span class="pill" id="mode-wait" hidden></span>
      </button>
      <span class="hint" id="mode-hint"></span>
    </div>
    <nav class="mobile-tabs" aria-label="Sections">
      <button data-view="list" aria-selected="false">List</button
      ><button data-view="map" aria-selected="true">Map</button
      ><button data-view="reader" aria-selected="false">Note</button>
    </nav>
    <main class="workspace" data-view="map">
      <aside>
        <h2 id="nav-title">Spec pages</h2>
        <input
          class="search"
          id="search"
          type="search"
          placeholder="Search knowledge"
          aria-label="Search titles and content"
        />
        <div class="section-label">Area</div>
        <select id="area" aria-label="Area">
          <option value="">All areas</option>
        </select>
        <div id="panel-spec">
          <div class="section-label">Show</div>
          <div class="filters" id="spec-filters" role="group" aria-label="Filter spec pages"></div>
        </div>
        <div id="panel-gaps" hidden>
          <div class="section-label">State</div>
          <div class="filters state-filters" id="state-filters" role="group" aria-label="Filter gaps by state"></div>
          <p class="subtle hintline" id="state-hint" hidden></p>
          <div class="section-label">Kind</div>
          <select id="kind" aria-label="Kind">
            <option value="">All kinds</option>
          </select>
        </div>
        <div class="section-label" id="list-label">Materials</div>
        <div class="list" id="list"></div>
        <div id="nav-block" hidden>
          <div class="section-label sub" id="nav-label">Overview and runs</div>
          <div class="list" id="nav-list"></div>
        </div>
      </aside>
      <section class="map" aria-labelledby="map-title">
        <div class="map-head">
          <div>
            <h1 id="map-title">Spec map</h1>
            <p id="map-desc"></p>
          </div>
        </div>
        <div class="counts" id="counts"></div>
        <div class="graph-wrap">
          <svg
            id="graph"
            role="img"
            aria-label="Linked knowledge map. Every item is also available in the list."
          ></svg>
          <div class="tools" aria-label="Map zoom">
            <button id="zoom-in" aria-label="Zoom in">+</button
            ><button id="zoom-out" aria-label="Zoom out">−</button
            ><button id="reset" aria-label="Reset view">↺</button>
          </div>
        </div>
        <p class="subtle hintline" id="graph-hint"></p>
      </section>
      <article class="reader" aria-live="polite">
        <div class="reader-top">
          <span>Item</span><span id="reader-updated"></span>
        </div>
        <div id="detail">
          <h2>Select an item</h2>
          <p class="subtle">
            Open a node on the map or choose an item from the list.
          </p>
        </div>
      </article>
    </main>
    <script id="knowledge-data" type="application/json">

nt, then test one allowed and one denied cancellation. Authentication, persistence and concurrent cancellations would each be a separate gap. For this example the gap marks the limit of what the vault can claim.\n\n## Decision\n\nOpen.\n", "summary": "", "stale": false, "kind": "verification-gap", "recheck": "not-checked", "recheckedBy": "", "recheckedOn": "", "decision": "open", "decidedBy": "", "decidedOn": "", "priority": "low", "confidence": "medium", "duplicateOf": "", "recheckOutdated": false, "state": "needs-recheck", "gap": "", "layer": "gap"}, {"id": "packed-cancellation", "title": "Should a customer be able to cancel their own packed pickup?", "type": "gap", "areas": ["pickups"], "sources": ["SPEC.md", "src/pickups.py", "src/routes.py", "tests/test_pickups.py"], "updated": "2026-11-15", "status": "", "tags": [], "path": "gaps/packed-cancellation.md", "body": "# Should a customer be able to cancel their own packed pickup?\n\n## Current behavior\n\nThe service cancels only `requested` pickups and rejects every other state, including `packed`, after the owner check; the adapter reports that as status 409. See [[notes/cancellation-boundary|the cancellation boundary]], [[notes/ownership-check|the owner check]] and [[notes/route-responses|the response mapping]].\n\n## Gap\n\nCAN-1 in [the requirements](../../../SPEC.md) says a customer can cancel their own pickup before collection, \"including when its state is `requested` or `packed`\". The code does not do that for `packed`. Should the service change so the owner can cancel a packed pickup?\n\n## Evidence\n\n- Documented intent: CAN-1 in [SPEC.md](../../../SPEC.md).\n- Static reading: the state guard in [cancel_pickup](../../../src/pickups.py) permits only `requested`; [cancel_request](../../../src/routes.py) maps the resulting `ValueError` to 409.\n- The three existing [tests](../../../tests/test_pickups.py) pass and none uses a `packed` pickup, so they neither show nor contradict the mismatch.\n\n## Recheck\ ted scope. Does the product want it? If so, who may act for whom, what identity evidence is required, and in which states?\n\n## Evidence\n\n- Documented intent: DEC-1 in [SPEC.md](../../../SPEC.md) says permissions, identity checks and allowed states \"have not been decided\".\n- Static reading: [cancel_request](../../../src/routes.py) has no partner parameter, role or contract.\n- Nothing was run: the fixture defines no partner behavior to run.\n\n## Recheck\n\n2026-11-15, agent: re-read [SPEC.md](../../../SPEC.md) and [routes.py](../../../src/routes.py) (static only). DEC-1 is still undecided in the requirements and the adapter still has no partner path, so the description above still holds (confirmed). The proposal itself is not judged here; that is for the person deciding. No command was run.\n\n## Discussion\n\n- 2026-11-14 · agent: Absence of a partner path is not a missing accepted feature. Options for a decider: (a) reject for now, (b) defer until a partner integration exists, (c) accept and define permissions, identity checks and states first.\n\n## Decision\n\nOpen.\n", "summary": "", "stale": false, "kind": "product-plan", "recheck": "confirmed", "recheckedBy": "agent", "recheckedOn": "2026-11-15", "decision": "open", "decidedBy": "", "decidedOn": "", "priority": "low", "confidence": "high", "duplicateOf": "", "recheckOutdated": false, "state": "needs-decision", "gap": "", "layer": "gap"}, {"id": "cancellation-boundary", "title": "Only requested pickups are currently cancellable", "type": "note", "areas": ["pickups"], "sources": ["src/pickups.py", "tests/test_pickups.py"], "updated": "2026-11-14", "status": "current", "tags": ["knowledge", "workflow"], "path": "notes/cancellation-boundary.md", "body": "# Only requested pickups are currently cancellable\n\nArea: [[areas/pickups|Pickup cancellation]]. Use this note when changing allowed states or explaining a rejected cancellation.\n\n`cancel_pickup` first runs the [[notes/ownership-check|ownership check]] y exists.\n\n`test_other_customer_cannot_cancel` in the [tests](../../../tests/test_pickups.py) uses a `requested` pickup and checks status 403 and unchanged state; it passed in the example check. [[notes/cancellation-boundary|State eligibility]] applies only after this check passes.\n", "summary": "", "stale": false, "kind": "", "recheck": "", "recheckedBy": "", "recheckedOn": "", "decision": "", "decidedBy": "", "decidedOn": "", "priority": "", "confidence": "", "duplicateOf": "", "recheckOutdated": false, "state": "", "gap": "", "layer": "spec"}, {"id": "route-responses", "title": "Cancellation exceptions become adapter statuses", "type": "note", "areas": ["pickups", "access"], "sources": ["src/routes.py", "src/pickups.py", "tests/test_pickups.py"], "updated": "2026-11-14", "status": "current", "tags": ["knowledge", "contract"], "path": "notes/route-responses.md", "body": "# Cancellation exceptions become adapter statuses\n\nAreas: [[areas/pickups|Pickup cancellation]] and [[areas/access|Customer access]].\n\nThe in-process `cancel_request` adapter calls `cancel_pickup` and returns a dictionary: `{\"status\": 403, \"error\": \"forbidden\"}` for `PermissionError`, `{\"status\": 409, \"error\": \"cancellation_conflict\"}` for `ValueError`, and `{\"status\": 200, \"state\": \u003cnew state\u003e}` on success. See [the adapter](../../../src/routes.py) and [the called service](../../../src/pickups.py).\n\n[[notes/ownership-check|Ownership]] decides the 403 case and [[notes/cancellation-boundary|state eligibility]] decides the 409 case, so a `packed` pickup owned by the caller reaches the 409 branch. The [existing tests](../../../tests/test_pickups.py) exercise the three branches with a requested, an other-customer and a collected pickup, and passed in the example check. The values are dictionaries returned in-process, not observed HTTP responses.\n", "summary": "", "stale": false, "kind": "", "recheck": "", "recheckedBy": "", "recheckedOn": "", "decision": "", "decide               n.type === "area" ? n.id : (n.areas || [])[0] || "other";
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push(n);
          });
          const positions = new Map();
          let y = 80,
            maxWidth = 700;
          [...groups.entries()]
            .sort(([a], [b]) => String(a).localeCompare(String(b)))
            .forEach(([key, group]) => {
              group.sort((a, b) =>
                a.type === "area"
                  ? -1
                  : b.type === "area"
                    ? 1
                    : model.context.has(a.id) !== model.context.has(b.id)
                      ? model.context.has(a.id)
                        ? 1
                        : -1
                      : stateRank(a) - stateRank(b) || byTitle(a, b),
              );
              const cols = Math.min(4, Math.max(1, group.length));
              group.forEach((n, i) =>
                positions.set(n.id, {
                  x: 140 + (i % cols) * 220,
                  y: y + Math.floor(i / cols) * 110,
                }),
              );
              maxWidth = Math.max(maxWidth, 280 + (cols - 1) * 220);
              y += Math.ceil(group.length / cols) * 110 + 55;
            });
          initialBox = {
            x: 0,
            y: 0,
            w: maxWidth,
            h: Math.min(700, Math.max(430, y + 20)),
          };
          if (!preserveView) box = { ...initialBox };
          applyBox();
          const layer = sv("g", {});
          graph.append(layer);
          model.links.forEach((e) => {
            if (ids.has(e.source) && ids.has(e.target)) {
              const a = positions.get(e.source),
                b = positions.get(e.target);
              if (a && b)
                layer.append(
                  sv("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y }),
                );
            }
          });
          shown.forEach((n) => {
            const p = positions.get(n.id),
              state = stateOf(n),
              g = sv("g", {
                class:
                  "graph-node " +
                  (n.type === "area" ? "area " : "") +
                  (isPlan(n) ? "plan-node " : "") +
                  (model.context.has(n.id) ? "context " : "") +
                  stateClass(n) +
                  (selected?.id === n.id ? " selected" : ""),
                transform: `translate(${p.x} ${p.y})`,
                tabindex: "0",
                role: "button",
                "aria-label":
                  n.title +
                  (state
                    ? " (" + stateLabels[state] + ")" +
                      (recheckOutdated(n) ? ", recheck outdated" : "")
                    : isPlan(n)
                      ? " (Plan)"
                      : ""),
              });
            if (isPlan(n))
              g.append(sv("rect", { x: -12, y: -12, width: 24, height: 24, rx: 4 }));
            else
              g.append(
                sv("circle", {
                  r:
                    n.type === "area"
                      ? 18
                      : ["needs-recheck", "needs-decision"].includes(state)
                        ? 16
                        : 13,
                }),
              );
            const t = sv("text", { x: 0, y: 32, "text-anchor": "middle" });
            const title = String(n.title || "");
            t.textContent = title.length > 28 ? title.slice(0, 27) + "…" : title;
            g.append(t);
            g.addEventListener("click", () => openNode(n));
            g.addEventListener("keydown", (e) => {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                openNode(n);
              }
            });
            layer.append(g);
          });
        }
        function applyBox() {
          graph.setAttribute("viewBox", `${box.x} ${box.y} ${box.w} ${box.h}`);
        }
        function zoom(f) {
          const w = box.w * f,
            h = box.h * f;
          box.x += (box.w - w) / 2;
          box.y += (box.h - h) / 2;
          box.w = w;
          box.h = h;
          applyBox();
        }
        $("#zoom-in").addEventListener("click", () => zoom(0.8));
        $("#zoom-out").addEventListener("click", () => zoom(1.25));
        $("#reset").addEventListener("click", () => {
          box = { ...initialBox };
          applyBox();
        });
        let drag = null;
        graph.addEventListener("pointerdown", (e) => {
          if (e.target.closest(".graph-node")) return;
          drag = { x: e.clientX, y: e.clientY, box: { ...box } };
          graph.setPointerCapture(e.pointerId);
          graph.classList.add("dragging");
        });
        graph.addEventListener("pointermove", (e) => {
          if (!drag) return;
          const rect = graph.getBoundingClientRect();
          box.x = drag.box.x - ((e.clientX - drag.x) * drag.box.w) / rect.width;
          box.y =
            drag.box.y - ((e.clientY - drag.y) * drag.box.h) / rect.height;
          applyBox();
        });
        graph.addEventListener("pointerup", () => {
          drag = null;
          graph.classList.remove("dragging");
        });
        graph.addEventListener("pointercancel", () => {
          drag = null;
          graph.classList.remove("dragging");
        });
        render();
      })();
    </script>
  </body>
</html>
